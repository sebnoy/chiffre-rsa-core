[package]
name = "chiffre-rsa-core"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Primitives RSA (génération, OAEP, sérialisation, empreinte) pour chiffre-aes-core"

[dependencies]
chiffre_aes_core = { git = "https://github.com/sebnoy/chiffre-aes-core", rev = "v2.0.0" }
rsa = "0.9"
sha2 = "0.10"
spki = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption", "pkcs5"] }
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["std"] }
thiserror = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
